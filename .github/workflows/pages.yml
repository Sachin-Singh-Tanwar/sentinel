name: pages

# SPEC §14: the dashboard is built here, never on the VM. The public demo reads static
# JSON from the `data` branch, so it keeps working when the API is down.

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: unit tests (gate, revert, refusals, golden guard)
        run: python -m pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: restore demo state from the data branch
        run: |
          mkdir -p state
          if git fetch origin data --depth=1; then
            git archive origin/data | tar -x -C state
            echo "restored $(ls -1 state | tr '\n' ' ')"
          else
            echo "no data branch yet — starting fresh"
          fi

      # Step 5 sources are config-only. Collect them before the books demo so the
      # board the dashboard renders has all five rows.
      - name: collect the four config-only sources
        env:
          SENTINEL_DB: state/sentinel.db
        run: |
          for source in hn gh apify remoteok; do
            echo "--- $source"
            python -m sentinel.cli run --source "$source"
          done

      - name: staged demo (healthy -> drift -> gate -> verified -> revert)
        env:
          SENTINEL_DB: state/sentinel.db
        run: python scripts/demo.py state/data

      # SQLite runs in WAL mode; checkpoint so the committed .db is complete.
      - name: checkpoint the demo database
        run: |
          python - <<'PY'
          import sqlite3
          conn = sqlite3.connect("state/sentinel.db")
          conn.execute("PRAGMA wal_checkpoint(TRUNCATE)")
          conn.close()
          PY

      # Append-only, same pattern as Tally: clone the branch, add one commit,
      # push it. History is never rewritten.
      - name: publish the data branch
        run: |
          REMOTE="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          rm -rf publish
          if git clone -q --branch data --single-branch "$REMOTE" publish; then
            echo "appending to the existing data branch"
          else
            echo "no data branch yet — creating it"
            git init -q -b data publish
            git -C publish remote add origin "$REMOTE"
          fi
          rm -rf publish/data
          cp -r state/data publish/data
          cp state/sentinel.db publish/sentinel.db
          git -C publish add -A
          if git -C publish diff --cached --quiet; then
            echo "data unchanged"
          else
            git -C publish \
              -c user.name="sentinel-bot" \
              -c user.email="sentinel-bot@users.noreply.github.com" \
              commit -q -m "data: demo run $(date -u +%FT%TZ)"
            git -C publish push origin data
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: build dashboard
        working-directory: dashboard
        run: |
          npm ci
          mkdir -p public/data
          cp -r ../publish/data/* public/data/
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
