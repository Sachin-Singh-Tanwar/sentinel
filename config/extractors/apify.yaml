# Extractor versions for `apify` (api.apify.com/v2/store).
#
# JSON. `stats.totalUsers` is the field most likely to change shape, which is what
# makes this source worth watching. Fields match the partner-verified apify.v1
# fixture: title, owner, total_users, pricing_model.

source: apify

versions:
  - version: apify.v2
    mode: json
    notes: Actor store listing, public unauthenticated endpoint
    container: data.items
    require: title
    fields:
      title:
        path: title
      owner:
        path: username
      total_users:
        path: stats.totalUsers
        parse: int
      pricing_model:
        path: currentPricingInfo.pricingModel
