# Extractor versions for `remoteok` (remoteok.com/api).
#
# JSON array at the document root, so `container` is empty. The first element is a
# legal notice rather than a job; `require: position` drops it and anything like it.
# Fields match the partner-verified remoteok.v1 fixture: position, company, tags, date.

source: remoteok

versions:
  - version: remoteok.v2
    mode: json
    notes: public job feed; entry 0 is a terms-of-service notice
    container: ""
    require: position
    fields:
      position:
        path: position
      company:
        path: company
      tags:
        path: tags
      date:
        path: date
